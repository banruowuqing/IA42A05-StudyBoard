<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放課後 Study Board</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header>
        <h1>放課後 Study Board</h1>
        <p>高校生のための勉強・交流掲示板</p>
    </header>

    <main>

        <div class="card">
            <h2>みんなで勉強しよう！</h2>

            <p>
                勉強で分からないことや学校生活の悩みを、
                気軽に質問できる掲示板です。
            </p>

            <p>
                名前を入力しなくても投稿できます。
            </p>

            <a class="button" href="/board">
                掲示板へ
            </a>
        </div>

        <div class="card">
            <h2>カテゴリー</h2>

            <h3>📚 勉強</h3>
            <p>勉強方法や分からない問題について。</p>

            <h3>✏️ テスト</h3>
            <p>テスト対策や受験について。</p>

            <h3>🏫 学校生活</h3>
            <p>学校行事や部活動について。</p>

            <h3>💬 相談</h3>
            <p>困っていることや悩みについて。</p>
        </div>

        <div class="card">
            <h2>利用ルール</h2>

            <p>・ほかの人に優しい言葉を使いましょう。</p>
            <p>・個人情報を書かないでください。</p>
            <p>・悪口を書かないでください。</p>
        </div>

    </main>

    <footer>
        放課後 Study Board
    </footer>

</body>
</html>
